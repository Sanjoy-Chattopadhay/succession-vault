name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1   # the version behind the published measurements
      - run: forge build
      - run: forge test

  app:
    name: App (proof test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
