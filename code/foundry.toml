[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
# The aggregation benchmark deploys thirteen cohorts, each with its own verifier, in one test.
# This raises only the ceiling; reported gas is per call and unaffected.
gas_limit = 100_000_000_000
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./fixtures" },
  { access = "read", path = "./test/legacy/zk" },
  { access = "read-write", path = "./reports" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./demo" },
]
gas_reports = ["BequestVault", "BequestFactory"]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
# Timestamps are narrowed to uint40 only after being bounded by block.timestamp.
exclude_lints = ["unsafe-typecast"]

[rpc_endpoints]
# Public endpoint, no API key needed. Override with --rpc-url <your provider URL> if it is slow.
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
